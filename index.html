<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Restaurante Multidispositivo</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-20">

  <!-- Barra Superior y Selector de Vista -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="text-xl font-bold">🍽️ Mi Restaurante POS</span>
        <span id="estado-conexion" class="text-xs bg-amber-500 text-black px-2 py-0.5 rounded-full font-semibold">Modo Prueba Local</span>
      </div>
      <nav class="flex gap-2 w-full sm:w-auto justify-center">
        <button onclick="cambiarVista('mesas')" id="btn-mesas" class="flex-1 sm:flex-none px-3 py-1.5 rounded bg-blue-600 font-medium text-sm">Mesas</button>
        <button onclick="cambiarVista('cocina')" id="btn-cocina" class="flex-1 sm:flex-none px-3 py-1.5 rounded bg-slate-700 font-medium text-sm">Cocina <span id="badge-cocina" class="ml-1 bg-red-500 text-white text-xs px-1.5 rounded-full hidden">0</span></button>
        <button onclick="cambiarVista('caja')" id="btn-caja" class="flex-1 sm:flex-none px-3 py-1.5 rounded bg-slate-700 font-medium text-sm">Caja</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4">

    <!-- VISTA 1: MESAS Y TOMA DE ORDEN (MESEROS) -->
    <section id="vista-mesas" class="space-y-6">
      <div>
        <h2 class="text-lg font-bold mb-3">Selecciona una Mesa</h2>
        <div id="grid-mesas" class="grid grid-cols-3 sm:grid-cols-6 gap-3"></div>
      </div>

      <!-- Panel de Pedido de Mesa Activa -->
      <div id="panel-orden" class="hidden bg-white p-4 rounded-xl shadow border border-gray-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="text-lg font-bold text-blue-700">Mesa #<span id="mesa-actual-num"></span></h3>
          <button onclick="cerrarPanelOrden()" class="text-sm text-gray-500 underline">Cerrar panel</button>
        </div>

        <!-- Menú Rápido -->
        <div>
          <p class="text-xs font-semibold text-gray-500 uppercase mb-2">Agregar al pedido</p>
          <div id="grid-menu" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
        </div>

        <!-- Nota especial -->
        <div class="flex gap-2">
          <input type="text" id="nota-platillo" placeholder="Nota para cocina (ej. Sin cebolla, bien cocido)..." class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>

        <!-- Resumen de la orden en esta mesa -->
        <div class="bg-gray-50 p-3 rounded-lg">
          <h4 class="text-sm font-bold mb-2">Orden Actual:</h4>
          <ul id="lista-orden-mesa" class="space-y-2 text-sm"></ul>
          <div class="border-t mt-3 pt-2 flex justify-between font-bold text-base">
            <span>Total Mesa:</span>
            <span>$<span id="total-mesa">0.00</span></span>
          </div>
        </div>

        <button onclick="enviarACocina()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow">
          Enviar Comanda a Cocina 👨‍🍳
        </button>
      </div>
    </section>

    <!-- VISTA 2: PANTALLA DE COCINA (KDS) -->
    <section id="vista-cocina" class="hidden space-y-4">
      <h2 class="text-lg font-bold">Comandas Pendientes en Cocina</h2>
      <div id="grid-cocina" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </section>

    <!-- VISTA 3: CAJA Y COBRO -->
    <section id="vista-caja" class="hidden space-y-4">
      <h2 class="text-lg font-bold">Cuentas Abiertas para Cobro</h2>
      <div id="grid-caja" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </section>

  </main>

  <!-- Lógica del Sistema (Lista para conectar con Firebase) -->
  <script type="module">
    // =========================================================================
    // CONFIGURACIÓN DE FIREBASE (Pega aquí tus credenciales de Firebase)
    // =========================================================================
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://gstatic.com";

    const firebaseConfig = {
      // PEGA AQUÍ TUS DATOS DE FIREBASE PARA SINCRONIZAR DISPOSITIVOS:
      apiKey: "TU_API_KEY",
      authDomain: "TU_://firebaseapp.com",
      projectId: "TU_PROYECTO_ID"
    };

    // Estado inicial de datos
    let estado = {
      mesas: {
        1: { ocupada: false, items: [], estadoCocina: 'ninguno' },
        2: { ocupada: false, items: [], estadoCocina: 'ninguno' },
        3: { ocupada: false, items: [], estadoCocina: 'ninguno' },
        4: { ocupada: false, items: [], estadoCocina: 'ninguno' },
        5: { ocupada: false, items: [], estadoCocina: 'ninguno' },
        6: { ocupada: false, items: [], estadoCocina: 'ninguno' }
      }
    };

    const menu = [
      { id: 1, nombre: "Tacos al Pastor (Orden)", precio: 85 },
      { id: 2, nombre: "Hamburguesa Clásica", precio: 120 },
      { id: 3, nombre: "Quesadilla Especial", precio: 65 },
      { id: 4, nombre: "Agua Fresca 1L", precio: 40 },
      { id: 5, nombre: "Refresco 600ml", precio: 30 },
      { id: 6, nombre: "Postre del Día", precio: 55 }
    ];

    let mesaSeleccionada = null;
    let db = null;
    let docRef = null;

    // Intentar conectar a Firebase si ya se pusieron las credenciales reales
    if (firebaseConfig.apiKey !== "TU_API_KEY") {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        docRef = doc(db, "restaurante", "estado_general");
        document.getElementById("estado-conexion").textContent = "🟢 En Línea (Sincronizado)";
        document.getElementById("estado-conexion").className = "text-xs bg-green-500 text-white px-2 py-0.5 rounded-full font-semibold";

        // Escuchar cambios en tiempo real desde cualquier celular/tablet
        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            estado = docSnap.data();
            renderizarTodo();
          } else {
            guardarEstado();
          }
        });
      } catch (e) {
        console.error("Error conectando Firebase:", e);
      }
    }

    async function guardarEstado() {
      renderizarTodo();
      if (docRef) {
        await setDoc(docRef, estado);
      }
    }

    // Funciones globales para los botones HTML
    window.cambiarVista = (vista) => {
      ['mesas', 'cocina', 'caja'].forEach(v => {
        document.getElementById(`vista-${v}`).classList.add('hidden');
        document.getElementById(`btn-${v}`).classList.replace('bg-blue-600', 'bg-slate-700');
      });
      document.getElementById(`vista-${vista}`).classList.remove('hidden');
      document.getElementById(`btn-${vista}`).classList.replace('bg-slate-700', 'bg-blue-600');
    };

    window.seleccionarMesa = (num) => {
      mesaSeleccionada = num;
      document.getElementById('mesa-actual-num').textContent = num;
      document.getElementById('panel-orden').classList.remove('hidden');
      renderizarOrdenMesa();
    };

    window.cerrarPanelOrden = () => {
      mesaSeleccionada = null;
      document.getElementById('panel-orden').classList.add('hidden');
    };

    window.agregarPlatillo = (idPlatillo) => {
      if (!mesaSeleccionada) return;
      const platillo = menu.find(p => p.id === idPlatillo);
      const nota = document.getElementById('nota-platillo').value.trim();
      
      estado.mesas[mesaSeleccionada].ocupada = true;
      estado.mesas[mesaSeleccionada].items.push({
        nombre: platillo.nombre,
        precio: platillo.precio,
        nota: nota
      });
      
      document.getElementById('nota-platillo').value = '';
      guardarEstado();
    };

    window.eliminarItem = (index) => {
      if (!mesaSeleccionada) return;
      estado.mesas[mesaSeleccionada].items.splice(index, 1);
      if (estado.mesas[mesaSeleccionada].items.length === 0) {
        estado.mesas[mesaSeleccionada].ocupada = false;
        estado.mesas[mesaSeleccionada].estadoCocina = 'ninguno';
      }
      guardarEstado();
    };

    window.enviarACocina = () => {
      if (!mesaSeleccionada || estado.mesas[mesaSeleccionada].items.length === 0) return;
      estado.mesas[mesaSeleccionada].estadoCocina = 'pendiente';
      guardarEstado();
      alert(`Comanda de Mesa #${mesaSeleccionada} enviada a cocina.`);
    };

    window.marcarListoCocina = (numMesa) => {
      estado.mesas[numMesa].estadoCocina = 'listo';
      guardarEstado();
    };

    window.cobrarMesa = (numMesa) => {
      const total = estado.mesas[numMesa].items.reduce((sum, item) => sum + item.precio, 0);
      if (confirm(`¿Confirmar cobro de $${total.toFixed(2)} para la Mesa #${numMesa}?`)) {
        estado.mesas[numMesa] = { ocupada: false, items: [], estadoCocina: 'ninguno' };
        if (mesaSeleccionada === numMesa) cerrarPanelOrden();
        guardarEstado();
      }
    };

    // Renderizado de interfaces
    function renderizarTodo() {
      renderizarMesas();
      renderizarMenu();
      if (mesaSeleccionada) renderizarOrdenMesa();
      renderizarCocina();
      renderizarCaja();
    }

    function renderizarMesas() {
      const grid = document.getElementById('grid-mesas');
      grid.innerHTML = '';
      Object.keys(estado.mesas).forEach(num => {
        const m = estado.mesas[num];
        const color = m.ocupada ? 'bg-amber-100 border-amber-500 text-amber-900' : 'bg-white border-gray-300 text-gray-700';
